name: CI

on:
  pull_request:
    branches: [main, demo]
  push:
    branches: [main, demo]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# A CI nem indít Woo-t: a katalógus a mentett Store API-fixture-ökből épül és fut (ADR-0005).
env:
  KG_STORE_FIXTURES: "1"
  # Pipeline-buildben kötelező (next.config.ts); a CI fixture-katalógusa lokális környezetnek számít.
  NEXT_PUBLIC_APP_ENV: local

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # typecheck, lint (ESLint + Steiger), Vitest és build minden csomagra
      - run: pnpm turbo run typecheck lint test build
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: |
            apps/web/.next
            !apps/web/.next/cache
          include-hidden-files: true
          retention-days: 1

  # A kg-headless plugin és a seed WordPress nélkül ellenőrizhető része: szintaxis, a tiszta függvényes
  # unit-tesztek (Omnibus, adószám) és a fail-closed őrök. A plugin minimum PHP-ján fut (`Requires PHP: 8.2`),
  # rögzített Docker-image-ben, nem a runner változó PHP-ján.
  php:
    name: PHP (kg-headless)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PHP_IMAGE: php:8.2-cli
    steps:
      - uses: actions/checkout@v7
      - run: git ls-files -z 'wordpress/*.php' | docker run --rm -i -v "$PWD:/repo" -w /repo "$PHP_IMAGE" xargs -0 -n1 php -l
      - run: docker run --rm -v "$PWD:/repo" -w /repo "$PHP_IMAGE" php wordpress/seed/test-omnibus.php
      - run: docker run --rm -v "$PWD:/repo" -w /repo "$PHP_IMAGE" php wordpress/seed/test-headless-guards.php

  e2e:
    name: E2E (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: web-build
          path: apps/web/.next
      - run: pnpm --filter @kg/web exec playwright install --with-deps chromium
      - run: pnpm --filter @kg/web test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
